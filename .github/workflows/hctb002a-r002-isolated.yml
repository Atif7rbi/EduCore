name: HCTB-002A R004 durable replay isolated test
on:
  push:
    branches:
      - ci/hctb002a-r002-isolated-20261118
    paths:
      - .github/workflows/hctb002a-r002-isolated.yml

permissions:
  contents: read

concurrency:
  group: hctb002a-r004-isolated
  cancel-in-progress: false

jobs:
  r004-synthetic:
    if: github.repository == 'Atif7rbi/EduCore' && github.ref == 'refs/heads/ci/hctb002a-r002-isolated-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout test-only branch without persistent credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify hosted runner, source manifest and test-only scope
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          test "${RUNNER_OS:-}" = Linux
          test "${GITHUB_ACTIONS:-}" = true
          test "${GITHUB_REPOSITORY:-}" = Atif7rbi/EduCore
          test "${GITHUB_REF:-}" = refs/heads/ci/hctb002a-r002-isolated-20261118
          cd ci/hctb002a/r002
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name 'test_*.py' | wc -l)" -eq 15
      - name: Execute 221 synthetic tests in networkless disposable UID-0 container
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          stage="$(mktemp -d "${RUNNER_TEMP}/hctb-r002.XXXXXX")"
          results="$(mktemp -d "${RUNNER_TEMP}/hctb-r002-results.XXXXXX")"
          echo "R002_RESULTS_DIR=$results" >> "$GITHUB_ENV"
          trap 'rm -rf -- "$stage"' EXIT
          cp -- ci/hctb002a/r002/*.py ci/hctb002a/r002/SHA256SUMS "$stage/"
          chmod 0755 "$stage"
          chmod 0644 "$stage"/*.py "$stage/SHA256SUMS"
          cd "$stage"
          sha256sum --check SHA256SUMS
          docker run --rm --pull always \
            --user 0:0 --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m,mode=1777 \
            --cap-drop ALL --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m --cpus 2 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            --mount "type=bind,src=$stage,dst=/work,readonly" \
            -w /work \
            python:3.12-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df \
            python -W error::ResourceWarning -m unittest discover -s /work -p 'test_*.py' -v \
            2>&1 | tee "$results/TEST_RESULTS.txt"
          grep -Eq '^Ran 221 tests in ' "$results/TEST_RESULTS.txt"
          grep -Eq '^OK$' "$results/TEST_RESULTS.txt"
          if grep -Ei 'skipped=|failed=|errors=' "$results/TEST_RESULTS.txt"; then exit 1; fi
          sha256sum "$results/TEST_RESULTS.txt" > "$results/TEST_RESULTS.sha256"
          printf 'S3_R004_ISOLATED_RUNNER=PASS\nTESTS=221_PASS\nHOST_ROOT_EXECUTION=NONE\nPHASE_B=NOT_AUTHORIZED\n' > "$results/VERDICT.txt"
      - name: Publish nonsecret test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hctb002a-r004-isolated-evidence
          path: ${{ env.R002_RESULTS_DIR }}/
          if-no-files-found: warn
          retention-days: 7
